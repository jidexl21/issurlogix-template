<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clients — Admin | InsurLogix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body data-portal="admin" data-page="clients">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="logo">L</div><div class="brand-text">InsurLogix</div></div>
      <div class="sidebar-nav"></div>
      <div class="sidebar-user">
        <div class="u-avatar">AO</div>
        <div><div class="u-name"></div><div class="u-role"></div></div>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger">☰</button>
          <div>
            <div class="topbar-title">Clients</div>
            <div class="topbar-sub">Onboarding and client document management</div>
          </div>
        </div>
        <div class="topbar-right"><div class="avatar">AO</div></div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1>Clients</h1>
            <p>Onboard new clients and add additional documents to their accounts.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" data-modal-open="addClientModal">➕ Add New Client</button>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="search" id="cSearch" class="form-control" placeholder="Search name, email, phone, account…">
          </div>
          <div class="spacer"></div>
          <span class="badge badge-primary no-dot" id="clientCount"></span>
        </div>

        <div class="card">
          <div class="card-body tight" id="clientsTable"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add client modal -->
  <div class="modal-backdrop" id="addClientModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <div><h3>Onboard new client</h3><div class="sub">Capture contact, address and account details</div></div>
        <button class="modal-close" data-modal-close>✕</button>
      </div>
      <form id="addClientForm" onsubmit="Admin.submitAddClient(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Full name <span class="req">*</span></label>
            <input name="clientName" class="form-control" placeholder="e.g. Ngozi Eze" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Email <span class="req">*</span></label>
              <input name="clientEmail" class="form-control" type="email" placeholder="client@email.com" required />
            </div>
            <div class="form-group">
              <label class="form-label">Phone <span class="req">*</span></label>
              <input name="clientPhone" class="form-control" placeholder="+234 801 234 5678" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Alternate phone</label>
            <input name="clientAltPhone" class="form-control" placeholder="+234 901 234 5678" />
          </div>
          <div class="form-group">
            <label class="form-label">Street address <span class="req">*</span></label>
            <input name="clientAddress" class="form-control" placeholder="14 Admiralty Way, Lekki Phase 1" required />
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label class="form-label">City</label>
              <input name="clientCity" class="form-control" placeholder="Lagos" />
            </div>
            <div class="form-group">
              <label class="form-label">State</label>
              <input name="clientState" class="form-control" placeholder="Lagos" />
            </div>
            <div class="form-group">
              <label class="form-label">Account code</label>
              <input name="clientAccount" class="form-control" placeholder="LG-2242" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Onboard client</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add client document modal -->
  <div class="modal-backdrop" id="addDocModal">
    <div class="modal">
      <div class="modal-header">
        <div><h3>Add client document</h3><div class="sub">Attach an additional document to the client's account</div></div>
        <button class="modal-close" data-modal-close>✕</button>
      </div>
      <form id="addDocForm" onsubmit="Admin.submitAddDoc(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Client <span class="req">*</span></label>
            <select name="docClient" class="form-control" required></select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Document type <span class="req">*</span></label>
              <select name="docType" class="form-control" required>
                <option>Insurance</option>
                <option>Vehicle Licence</option>
                <option>Roadworthiness</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Document number <span class="req">*</span></label>
              <input name="docNumber" class="form-control" placeholder="e.g. INS-123456" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Issue date <span class="req">*</span></label>
              <input type="date" name="docIssueDate" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label">Expiry date <span class="req">*</span></label>
              <input type="date" name="docExpiryDate" class="form-control" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Policy type <small class="muted">(insurance only)</small></label>
            <input name="docPolicy" class="form-control" placeholder="e.g. Comprehensive" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Add document</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const docSelect = document.getElementById("addDocModal").querySelector('select[name="docClient"]');
      DB.clients.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name + " (" + c.account + ")";
        docSelect.appendChild(opt);
      });
    });
  </script>
</body>
</html>
