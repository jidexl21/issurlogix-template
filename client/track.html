<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track My Documents — Client | InsurLogix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body data-portal="client" data-page="track">
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="logo">L</div><div class="brand-text">InsurLogix</div></div>
      <div class="sidebar-nav"></div>
      <div class="sidebar-user">
        <div class="u-avatar">AO</div>
        <div><div class="u-name"></div><div class="u-role"></div></div>
      </div>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger">☰</button>
          <div>
            <div class="topbar-title">Track My Documents</div>
            <div class="topbar-sub">Processing → Awaiting Delivery → Out For Delivery → Delivered → Accepted</div>
          </div>
        </div>
        <div class="topbar-right"><div class="avatar">AO</div></div>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1>Track my documents</h1>
            <p>Select a document to see exactly where it is right now.</p>
          </div>
        </div>

        <div class="filter-bar">
          <div class="tabs" style="margin:0;border:none">
            <div id="trackDocs" class="row" style="gap:6px"></div>
          </div>
        </div>

        <div id="trackDetail"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/client.js"></script>
</body>
</html>
